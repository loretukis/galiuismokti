<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pabėgę veiksmų ženklai | GALIU IŠMOKTI!</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#18324e;background:#eff8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 5%,#d8efff,transparent 36%),radial-gradient(circle at 95% 90%,#e6f6e9,transparent 38%),#f6fbff}.wrap{max-width:940px;margin:auto;padding:24px 18px 50px}.back{display:inline-block;color:#225f94;text-decoration:none;font-weight:700;margin:4px 0 25px}.back:hover{text-decoration:underline}header{text-align:center}h1{font-size:clamp(30px,5vw,48px);margin:8px 0;color:#174a79}header p{color:#58718b;font-size:17px;margin:0 0 24px}.panel{background:white;border:1px solid #d9eaf5;border-radius:24px;box-shadow:0 14px 40px #2d618516;padding:clamp(20px,4vw,40px)}.levels{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.levels button{border:2px solid #d4e5f2;background:#f7fbff;color:#245273;border-radius:14px;padding:12px 17px;font-weight:750;cursor:pointer;font-size:15px}.levels button[aria-pressed=true]{background:#dff1ff;border-color:#4a9dd4;color:#14527e}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:27px 0 10px;color:#58718b;font-weight:650}.stats strong{color:#174a79}.equation{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(5px,1.3vw,13px);padding:30px 0 12px;min-height:150px}.num,.eq{font-size:clamp(25px,5.5vw,46px);font-weight:780;font-variant-numeric:tabular-nums}.sign{width:clamp(45px,9vw,65px);height:clamp(53px,10vw,70px);border:2px dashed #78a9cd;background:#f0f8ff;border-radius:14px;font-size:clamp(27px,5vw,40px);font-weight:800;color:#195e91;cursor:pointer}.sign:focus-visible,button:focus-visible{outline:3px solid #f3b742;outline-offset:3px}.sign.chosen{border-style:solid;background:#dff1ff}.hint{text-align:center;color:#617990;margin:8px 0 20px}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.actions button{border:0;border-radius:13px;padding:14px 23px;font-weight:750;font-size:16px;cursor:pointer}.primary{background:#257fbd;color:white}.primary:hover{background:#1c699e}.secondary{background:#eaf3fa;color:#245273}.actions button:disabled{opacity:.5;cursor:not-allowed}.message{min-height:54px;text-align:center;padding:15px 8px;font-weight:750;font-size:18px}.message.good{color:#21734c}.message.bad{color:#b04c35}.note{text-align:center;color:#678099;font-size:14px;margin-top:25px}@media(max-width:480px){.panel{padding:17px 12px}.equation{gap:5px}.num,.eq{font-size:25px}.sign{width:42px;height:52px;font-size:28px}.stats{font-size:14px}}
</style>
</head>
<body><main class="wrap"><a class="back" href="../../index.html">← Į pagrindinį puslapį</a><header><h1>➕ Pabėgę veiksmų ženklai ➖</h1><p>Surask tinkamus ženklus, kad lygybė būtų teisinga!</p></header><section class="panel" aria-label="Žaidimas"><div class="levels" role="group" aria-label="Sudėtingumo lygis"><button data-level="easy" aria-pressed="true">🌱 Lengvas</button><button data-level="medium" aria-pressed="false">⭐ Vidutinis</button><button data-level="hard" aria-pressed="false">🚀 Sunkus</button></div><div class="stats"><span>Užduotis: <strong id="round">1</strong></span><span>Teisingai: <strong id="score">0</strong></span><span>Bandymų: <strong id="tries">0</strong></span></div><div id="equation" class="equation" aria-label="Lygybė"></div><p class="hint">Spausk langelį: ? → + → − → ?</p><div class="actions"><button id="check" class="primary">Patikrinti</button><button id="next" class="secondary">Kita užduotis →</button><button id="reset" class="secondary">Pradėti iš naujo</button></div><div id="message" class="message" role="status" aria-live="polite"></div></section><p class="note">Bandau. Atrandu. Tobulėju. · GALIU IŠMOKTI!</p></main>
<script>
(()=>{'use strict';
const configs={easy:{count:3,min:1,max:20,targetMax:30},medium:{count:3,min:5,max:99,targetMax:100},hard:{count:4,min:10,max:150,targetMax:250}};
const eq=document.getElementById('equation'),msg=document.getElementById('message');let level='easy',round=1,score=0,tries=0,solved=false,puzzle=null,choices=[];const seen={easy:new Set(),medium:new Set(),hard:new Set()};
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function evaluate(nums,signs){return nums.slice(1).reduce((sum,n,i)=>sum+(signs[i]==='+'?n:-n),nums[0]);}
function uniqueSolutions(nums,target){let count=0,answer=null;for(let mask=0;mask<(1<<(nums.length-1));mask++){const signs=nums.slice(1).map((_,i)=>(mask&(1<<i))?'+':'-');if(evaluate(nums,signs)===target){count++;answer=signs;}}return {count,answer};}
function generate(){const c=configs[level];for(let attempt=0;attempt<20000;attempt++){const nums=Array.from({length:c.count},()=>rnd(c.min,c.max));const signs=Array.from({length:c.count-1},()=>Math.random()<.5?'+':'-');const target=evaluate(nums,signs);if(target<0||target>c.targetMax)continue;const key=nums.join(',')+'='+target;if(seen[level].has(key))continue;const result=uniqueSolutions(nums,target);if(result.count!==1)continue;seen[level].add(key);return {nums,target,answer:result.answer};}throw Error('Nepavyko sugeneruoti užduoties');}
function render(){eq.replaceChildren();puzzle.nums.forEach((n,i)=>{if(i){const b=document.createElement('button');b.className='sign'+(choices[i-1]?' chosen':'');b.type='button';b.textContent=choices[i-1]||'?';b.setAttribute('aria-label',`${i} veiksmų ženklas: ${choices[i-1]||'nepasirinktas'}`);b.disabled=solved;b.addEventListener('click',()=>{choices[i-1]=choices[i-1]===''?'+':choices[i-1]==='+'?'-':'';msg.textContent='';msg.className='message';render();});eq.append(b);}const span=document.createElement('span');span.className='num';span.textContent=n;eq.append(span);});const end=document.createElement('span');end.className='eq';end.textContent='= '+puzzle.target;eq.append(end);document.getElementById('round').textContent=round;document.getElementById('score').textContent=score;document.getElementById('tries').textContent=tries;document.getElementById('check').disabled=solved;}
function newPuzzle(){puzzle=generate();choices=Array(puzzle.nums.length-1).fill('');solved=false;msg.textContent='';msg.className='message';render();}
document.getElementById('check').addEventListener('click',()=>{if(solved)return;if(choices.some(x=>!x)){msg.textContent='Pirmiausia pasirink visus ženklus.';msg.className='message bad';return;}tries++;if(evaluate(puzzle.nums,choices)===puzzle.target){solved=true;score++;msg.textContent='🎉 Teisingai! Puikiai išspręsta!';msg.className='message good';}else{msg.textContent=`Dar ne! Gavosi ${evaluate(puzzle.nums,choices)}, o reikia ${puzzle.target}. Bandyk dar.`;msg.className='message bad';}render();});
document.getElementById('next').addEventListener('click',()=>{round++;newPuzzle();});document.getElementById('reset').addEventListener('click',()=>{round=1;score=0;tries=0;seen[level].clear();newPuzzle();});document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{level=b.dataset.level;document.querySelectorAll('[data-level]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));round=1;score=0;tries=0;newPuzzle();}));newPuzzle();
})();
</script></body></html>
