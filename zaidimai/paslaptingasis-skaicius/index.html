function translateClue(t){if(lang==="lt")return t;const item=properties(level).find(p=>p.text===t);if(item&&item.en)return item.en;let m;const fixed={"Esu lyginis skaičius.":"I am an even number.","Esu nelyginis skaičius.":"I am an odd number.","Esu lyginis.":"I am even.","Nesu dešimties kartotinis.":"I am not a multiple of ten.","Mano vienetų skaitmuo didesnis už dešimčių skaitmenį.":"My ones digit is greater than my tens digit.","Mano dešimčių skaitmuo didesnis už vienetų skaitmenį.":"My tens digit is greater than my ones digit.","Abu mano skaitmenys lyginiai.":"Both my digits are even.","Abu mano skaitmenys nelyginiai.":"Both my digits are odd.","Mano vienetų skaitmuo dvigubai didesnis už dešimčių skaitmenį.":"My ones digit is twice my tens digit.","Mano dešimčių skaitmuo dvigubai didesnis už vienetų skaitmenį.":"My tens digit is twice my ones digit.","Mano skaitmenų suma didesnė už 10.":"The sum of my digits is greater than 10.","Mano skaitmenų suma mažesnė už 10.":"The sum of my digits is less than 10.","Mano vienetų skaitmuo yra pusė dešimčių skaitmens.":"My ones digit is half my tens digit.","Mano vienetų skaitmuo nėra nulis.":"My ones digit is not zero."};if(fixed[t])return fixed[t];if((m=t.match(/^Esu didesnis už (\d+), bet mažesnis už (\d+)\.$/)))return `I am greater than ${m[1]} but less than ${m[2]}.`;if((m=t.match(/^Esu didesnis už (\d+)\.$/)))return `I am greater than ${m[1]}.`;if((m=t.match(/^Esu mažesnis už (\d+)\.$/)))return `I am less than ${m[1]}.`;if((m=t.match(/^Esu tarp (\d+) ir (\d+)\.$/)))return `I am between ${m[1]} and ${m[2]}.`;if((m=t.match(/^Mano skaitmenų suma yra (\d+)\.$/)))return `The sum of my digits is ${m[1]}.`;if((m=t.match(/^Mano skaitmenų skirtumas yra (\d+)\.$/)))return `The difference between my digits is ${m[1]}.`;if((m=t.match(/^Mano vienetų skaitmuo yra (\d+)\.$/)))return `My ones digit is ${m[1]}.`;if((m=t.match(/^Mano dešimčių skaitmuo yra (\d+)\.$/)))return `My tens digit is ${m[1]}.`;return t;}

let level=1, puzzle=null, visible=1, crossed=new Set(),solved=false,previousKey='';
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const digits=n=>[Math.floor(n/10),n%10];

// Each clue belongs to a pedagogical family. No two clues from the same
// family occur in one puzzle, avoiding both repetition and logical redundancy.
const history=new Set();
function properties(level){
 const p=[];
 const add=(text,en,test,kind)=>p.push({text,en,test,kind});
 for(const k of [20,30,40,50,60,70,80,90]){
  add(`Esu didesnis už ${k}.`,`I am greater than ${k}.`,n=>n>k,"range");
  add(`Esu mažesnis už ${k}.`,`I am less than ${k}.`,n=>n<k,"range");
 }
 for(const [a,b] of [[10,40],[20,50],[30,60],[40,70],[50,80],[60,90],[70,100],[20,70],[30,80],[40,90]]){
  add(`Esu tarp ${a} ir ${b}.`,`I am between ${a} and ${b}.`,n=>n>a&&n<b,"range");
 }
 add("Esu lyginis skaičius.","I am an even number.",n=>n%2===0,"parity");
 add("Esu nelyginis skaičius.","I am an odd number.",n=>n%2===1,"parity");
 // Level 1 can state a digit directly. Later levels must express it indirectly.
 if(level===1){
  for(let k=0;k<=9;k++){
   add(`Mano vienetų skaitmuo yra ${k}.`,`My ones digit is ${k}.`,n=>n%10===k,"ones");
  }
  for(let k=1;k<=9;k++){
   add(`Mano dešimčių skaitmuo yra ${k}.`,`My tens digit is ${k}.`,n=>Math.floor(n/10)===k,"tens");
  }
  add("Mano vienetų skaitmuo didesnis už 5.","My ones digit is greater than 5.",n=>n%10>5,"ones");
  add("Mano vienetų skaitmuo mažesnis už 5.","My ones digit is less than 5.",n=>n%10<5,"ones");
  for(const k of [2,3,4,5,6,7,8]){
   add(`Mano dešimčių skaitmuo didesnis už ${k}.`,`My tens digit is greater than ${k}.`,n=>digits(n)[0]>k,"tens_compare");
   add(`Mano vienetų skaitmuo mažesnis už ${k}.`,`My ones digit is less than ${k}.`,n=>digits(n)[1]<k,"ones_compare");
  }
 }
 if(level>=2){
  add("Abu mano skaitmenys lyginiai.","Both my digits are even.",n=>digits(n).every(d=>d%2===0),"digit_parity");
  add("Abu mano skaitmenys nelyginiai.","Both my digits are odd.",n=>digits(n).every(d=>d%2===1),"digit_parity");
  add("Mano skaitmenys skirtingi.","My digits are different.",n=>digits(n)[0]!==digits(n)[1],"digit_relation");
  add("Mano skaitmenys vienodi.","My digits are the same.",n=>digits(n)[0]===digits(n)[1],"digit_relation");
  add("Mano vienetų skaitmuo didesnis už dešimčių skaitmenį.","My ones digit is greater than my tens digit.",n=>digits(n)[1]>digits(n)[0],"digit_relation");
  add("Mano dešimčių skaitmuo didesnis už vienetų skaitmenį.","My tens digit is greater than my ones digit.",n=>digits(n)[0]>digits(n)[1],"digit_relation");
  for(let k=3;k<=17;k++){
   add(`Mano skaitmenų suma yra ${k}.`,`The sum of my digits is ${k}.`,n=>digits(n)[0]+digits(n)[1]===k,"digit_sum");
  }
  for(let k=1;k<=9;k++){
   add(`Mano vienetų skaitmuo lygus skaičių ${k+7} ir 7 skirtumui.`,`My ones digit equals the difference between ${k+7} and 7.`,n=>n%10===k,"ones");
   add(`Mano dešimčių skaitmuo lygus skaičių ${k+6} ir 6 skirtumui.`,`My tens digit equals the difference between ${k+6} and 6.`,n=>digits(n)[0]===k,"tens");
  }
 }
 if(level>=3){
  for(let k=1;k<=8;k++){
   add(`Mano skaitmenų skirtumas yra ${k}.`,`The difference between my digits is ${k}.`,n=>Math.abs(digits(n)[0]-digits(n)[1])===k,"digit_difference");
  }
  for(let k=1;k<=4;k++){
   add(`Mano vienetų skaitmuo lygus skaičiaus ${2*k} pusei.`,`My ones digit is half of ${2*k}.`,n=>n%10===k,"ones");
   add(`Mano dešimčių skaitmuo lygus skaičiaus ${2*k} pusei.`,`My tens digit is half of ${2*k}.`,n=>digits(n)[0]===k,"tens");
  }
  for(let k=1;k<=3;k++){
   add(`Mano vienetų skaitmuo lygus skaičiaus ${3*k} trečdaliui.`,`My ones digit is one third of ${3*k}.`,n=>n%10===k,"ones");
  }
  add("Mano vienetų skaitmuo dvigubai didesnis už dešimčių skaitmenį.","My ones digit is twice my tens digit.",n=>digits(n)[1]===2*digits(n)[0],"digit_relation");
  add("Mano dešimčių skaitmuo dvigubai didesnis už vienetų skaitmenį.","My tens digit is twice my ones digit.",n=>digits(n)[0]===2*digits(n)[1],"digit_relation");
 }
 if(level>=4){
  for(let k=2;k<=16;k++){
   add(`Mano skaitmenų suma lygi skaičių ${k+9} ir 9 skirtumui.`,`The sum of my digits equals the difference between ${k+9} and 9.`,n=>digits(n)[0]+digits(n)[1]===k,"digit_sum");
  }
  for(let k=1;k<=8;k++){
   add(`Mano skaitmenų skirtumas lygus skaičiaus ${2*k} pusei.`,`The difference between my digits is half of ${2*k}.`,n=>Math.abs(digits(n)[0]-digits(n)[1])===k,"digit_difference");
  }

   add(`Mano skaitmenų sandauga mažesnė už ${k}.`,`The product of my digits is less than ${k}.`,n=>digits(n)[0]*digits(n)[1]<k,"product");

function generate(){
 const all=Array.from({length:90},(_,i)=>i+10);
 const props=properties(level);
 // A candidate puzzle is built by choosing five DIFFERENT clue families.
 // Each clue must eliminate at least one of the ten numbers, and the last
 // clue must leave exactly one. No fallback puzzle is reused.
 for(let attempt=0;attempt<45000;attempt++){
  const target=all[rand(0,all.length-1)];
  const candidates=shuffle([...shuffle(all.filter(n=>n!==target)).slice(0,9),target]);
  let remaining=candidates.slice(),chosen=[],used=new Set();
  for(let step=0;step<5;step++){
   const options=shuffle(props).filter(p=>p.test(target)&&!used.has(p.kind)&&remaining.some(n=>!p.test(n)))
    .map(p=>({p,kept:remaining.filter(n=>p.test(n))}))
    .filter(x=>step===4?x.kept.length===1:x.kept.length>=6-step&&x.kept.length<remaining.length);
   if(!options.length)break;
   const ideal=[8,6,4,2,1][step];
   options.sort((a,b)=>Math.abs(a.kept.length-ideal)-Math.abs(b.kept.length-ideal));
   const pick=options[rand(0,Math.min(3,options.length-1))];
   chosen.push(pick.p);used.add(pick.p.kind);remaining=pick.kept;
  }
  if(chosen.length!==5||remaining.length!==1)continue;
  if(level===4&&!chosen.some(c=>["product","digit_difference","reversal"].includes(c.kind)))continue;
  const key=[level,[...candidates].sort((a,b)=>a-b).join(","),chosen.map(c=>c.text).join("|")].join("::");
  if(history.has(key))continue;
  history.add(key);
  return {target,candidates,clues:chosen};
 }
 throw new Error("Nepavyko sugeneruoti naujo galvosūkio. Bandykite dar kartą.");
}

 const t=translations[lang],shown=clueMode==="all"?5:visible;
 $("#levelDesc").textContent=t.descs[level-1];
 $("#progress").textContent=clueMode==="all"?(lang==="lt"?"Visos 5 užuominos":"All 5 clues"):(lang==="lt"?`Užuomina ${visible} iš 5`:`Clue ${visible} of 5`);
 // Five fixed slots prevent the number grid from jumping when clues are revealed.
 $("#clues").innerHTML=puzzle.clues.map((c,i)=>i<shown?`<div class="clue ${clueMode==="one"&&i===visible-1?"current":""}"><strong>${t.clue} ${i+1}</strong>${translateClue(c.text)}</div>`:`<div class="clue placeholder"><strong>${t.clue} ${i+1} · …</strong></div>`).join("");
 const remaining=puzzle.candidates.filter(n=>!crossed.has(n));
 $("#numbers").innerHTML=puzzle.candidates.map(n=>{
 const cls=crossed.has(n)?"crossed":remaining.length===1&&remaining[0]===n?(n===puzzle.target?"correct":"incorrect"):"";
 return `<button type="button" class="number ${cls}" data-num="${n}" aria-pressed="${crossed.has(n)}">${n}</button>`;
 }).join("");
 $("#numbers").querySelectorAll("button").forEach(b=>b.onclick=()=>{
 if(solved)return;
 const n=Number(b.dataset.num);crossed.has(n)?crossed.delete(n):crossed.add(n);
 const rem=puzzle.candidates.filter(x=>!crossed.has(x));
 const feedback=$("#feedback");feedback.textContent="";feedback.className="feedback";
 if(rem.length===1){
 if(rem[0]===puzzle.target){solved=true;feedback.className="feedback good";feedback.textContent=translations[lang].win(puzzle.target);}
 else{feedback.className="feedback bad";feedback.textContent=lang==="lt"?"Likęs skaičius neteisingas. Gali grąžinti išbrauktus skaičius ir bandyti dar kartą.":"That is not the mystery number. Restore crossed-out numbers and try again.";}
 }
 render();
 });
 $("#nextClue").style.display=clueMode==="all"?"none":"";
 $("#nextClue").disabled=visible===5||solved;
 $("#check").disabled=solved;
}
function newGame(){puzzle=generate();visible=1;crossed=new Set();solved=false;$("#feedback").textContent="";$("#feedback").className="feedback";render()}
$("#check").onclick=()=>{
 const shown=clueMode==="all"?5:visible;
 const allowed=puzzle.candidates.filter(n=>puzzle.clues.slice(0,shown).every(c=>c.test(n)));
 const wrong=allowed.some(n=>crossed.has(n)),missed=puzzle.candidates.some(n=>!allowed.includes(n)&&!crossed.has(n));
 const f=$("#feedback");
 if(wrong||missed){f.className="feedback bad";f.textContent=wrong?translations[lang].wrong:translations[lang].missed;return;}
 if(allowed.length===1){solved=true;f.className="feedback good";f.textContent=translations[lang].win(puzzle.target);}
 else{f.className="feedback good";f.textContent=translations[lang].correct;}
 render();
};
$("#nextClue").onclick=()=>{if(visible<5){visible++;$("#feedback").textContent="";$("#feedback").className="feedback";render()}};
$("#newGame").onclick=newGame;
$("#levelSelect").onchange=e=>{level=Number(e.target.value);newGame()};
document.querySelectorAll('input[name="clueMode"]').forEach(r=>r.onchange=()=>{clueMode=document.querySelector('input[name="clueMode"]:checked').value;$("#feedback").textContent="";$("#feedback").className="feedback";render()});
function printPage(){
 const en=lang==="en",t=translations[lang];
 const header=`<div class="print-top"><span>GALIUISMOKTI.LT</span><div class="fields"><span>${en?"Name":"Vardas"} <span class="line"></span></span><span>${en?"Date":"Data"} <span class="line"></span></span></div></div>`;
 const footer='<div class="print-footer"><span>Galiu išmokti!</span><span>galiuismokti.lt</span></div>';
 const title=`<div class="print-title">${en?"MYSTERY NUMBER":"PASLAPTINGASIS SKAIČIUS"}</div><div class="print-sub">${en?"Level":"Lygis"} ${level} · ${t.descs[level-1]}</div>`;
 const clues=`<div class="print-section">${en?"Clues":"Užuominos"}</div><p class="print-instruction">${en?"Read the clues and cross out numbers that do not fit.":"Perskaityk užuominas ir išbrauk netinkamus skaičius."}</p><ol class="print-clues">${puzzle.clues.map(c=>`<li>${translateClue(c.text)}</li>`).join("")}</ol>`;
 const nums=`<div class="print-section">${en?"Numbers":"Skaičiai"}</div><div class="print-numbers">${puzzle.candidates.map(n=>`<div class="print-num">${n}</div>`).join("")}</div>`;
 let html=`<div>${header}${title}${clues}${nums}${footer}</div>`;
 if($("#printAnswers").checked)html+=`<div class="answer-sheet">${header}${title}<div class="print-section">${en?"Answer sheet":"Atsakymų lapas"}</div><p>${en?"Mystery number":"Paslaptingasis skaičius"}: <strong>${puzzle.target}</strong></p><ol class="print-clues">${puzzle.clues.map(c=>`<li>${translateClue(c.text)}</li>`).join("")}</ol>${footer}</div>`;
 $("#printDocument").innerHTML=html;
 window.print();
}
$("#print").onclick=printPage;
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;$("#feedback").textContent="";$("#feedback").className="feedback";updateLanguage()});
newGame();updateLanguage();
</script></body></html>
