<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Įdomieji kvadratai ir trikampiai</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,system-ui,sans-serif;color:#23345d;background:#f3f6ff}button,select{font:inherit}button{cursor:pointer;touch-action:manipulation}.mg-app{width:100%;height:100%;height:100dvh;display:flex;flex-direction:column;padding:clamp(5px,1vh,12px);gap:clamp(5px,1vh,10px);overflow:hidden}.mg-head{text-align:center;flex:none;position:relative;padding-left:155px;padding-right:155px}.mg-back{position:absolute;left:0;top:0;display:inline-flex;align-items:center;justify-content:center;padding:7px 10px;border-radius:9px;border:1px solid #cbd7f1;background:#fff;color:#304e9c;text-decoration:none;font-weight:700;font-size:12px;min-height:32px}.mg-back:hover,.mg-back:focus-visible{background:#e8efff}.mg-head h1{font-size:clamp(16px,2.4vw,29px);margin:0;color:#293d82}.mg-head p{font-size:clamp(10px,1.1vw,13px);margin:3px 0 0}.mg-main{flex:1;min-height:0;min-width:0;display:grid;grid-template-columns:minmax(180px,1fr) minmax(220px,1.5fr) minmax(150px,.85fr);gap:10px;background:white;border:1px solid #dfe5f2;border-radius:18px;padding:clamp(7px,1vw,14px);overflow:hidden}.mg-controls,.mg-play,.mg-keypanel{min-height:0;min-width:0}.mg-controls{display:flex;flex-direction:column;justify-content:center;gap:10px}.mg-controls label{display:grid;gap:5px;font-size:clamp(11px,1.1vw,14px);font-weight:700}.mg-controls select,.mg-btn{width:100%;min-height:36px;padding:7px 9px;border:2px solid #cdd8f0;border-radius:10px;background:white;color:#263b72}.mg-btn-primary{background:#4c61d8;color:white;border-color:#4c61d8;font-weight:700}.mg-play{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;overflow:hidden}.mg-meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:none}.mg-pill{background:#eaf0ff;border-radius:30px;padding:5px 9px;font-size:clamp(11px,1vw,14px);font-weight:700;white-space:nowrap}.mg-board-space{flex:1;min-height:0;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}.mg-square{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:5px;padding:7px;border-radius:15px;background:#b9c7ef;aspect-ratio:1/1;max-width:100%;max-height:100%;width:min(100%, 54vh, 420px);height:auto;min-width:0;min-height:0}.mg-cell{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;width:100%;height:100%;padding:0;border:2px solid #d0dcf2;border-radius:9px;background:white;color:#293c76;font-size:clamp(17px,3.4vmin,37px);font-weight:800;line-height:1}.mg-cell.mg-given{background:#e8edfa;color:#26385f}.mg-cell.mg-active{outline:3px solid #f2a930;outline-offset:-3px}.mg-cell.mg-right{background:#d9f8e5;border-color:#2cab65;color:#155d37}.mg-cell.mg-wrong{background:#ffe0e7;border-color:#e65b70;color:#99263c}.mg-triangle{position:relative;width:min(100%, 58vh, 430px);aspect-ratio:1.12/1;max-height:100%;flex:none}.mg-triangle svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.mg-triangle .mg-cell{position:absolute;width:19%;height:21%;transform:translate(-50%,-50%);border-radius:50%;font-size:clamp(15px,2.7vmin,30px)}.mg-info{font-size:clamp(10px,1vw,13px);text-align:center;line-height:1.25;flex:none}.mg-status{font-size:clamp(11px,1.1vw,14px);font-weight:700;min-height:1.2em;text-align:center;flex:none}.mg-keypanel{display:flex;flex-direction:column;justify-content:center;gap:7px}.mg-keytitle{text-align:center;font-weight:700;font-size:clamp(12px,1.3vw,16px)}.mg-entry{height:36px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:#f0efff;font-weight:700;font-size:20px}.mg-keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.mg-key{min-width:0;min-height:38px;border:2px solid #d5ddf0;border-radius:9px;background:#fff;font-weight:750;font-size:clamp(14px,1.5vw,21px);color:#263a70}.mg-key.mg-action{font-size:clamp(10px,1vw,13px);background:#e6ecfb}.mg-key.mg-confirm{background:#d8f3e2}.mg-footer{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;min-height:32px}.mg-footer button{border:2px solid #cbd7ef;border-radius:10px;background:white;padding:6px 12px;font-size:clamp(11px,1vw,13px)}.mg-help{font-size:12px;text-align:center}.mg-complete{padding:6px 10px;border-radius:10px;background:#ddf9e8;text-align:center;font-weight:700;font-size:clamp(12px,1.2vw,16px)}.mg-hidden{display:none!important}
@media(max-width:760px){.mg-app{padding:5px;gap:4px}.mg-head h1{font-size:clamp(14px,3.7vw,22px)}.mg-head p{display:none}.mg-main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:5px;padding:6px;border-radius:12px}.mg-controls{grid-column:1/-1;grid-row:1;flex-direction:row;align-items:end;gap:5px}.mg-controls label{flex:1;min-width:0;font-size:11px}.mg-controls select{width:100%;min-height:32px;padding:3px;font-size:11px}.mg-controls .mg-btn{flex:1;min-height:32px;font-size:11px;padding:3px}.mg-play{grid-column:1;grid-row:2}.mg-keypanel{grid-column:2;grid-row:2}.mg-square{width:min(100%, 42vh, 360px);gap:3px;padding:4px}.mg-triangle{width:min(100%, 42vh, 360px)}.mg-cell{font-size:clamp(13px,4vw,28px);border-radius:6px}.mg-key{min-height:32px}.mg-meta{gap:3px}.mg-pill{font-size:10px;padding:3px 5px}.mg-info{font-size:10px}.mg-status{font-size:10px}.mg-keytitle{font-size:12px}.mg-entry{height:28px;font-size:16px}.mg-footer{min-height:28px}.mg-footer button{padding:4px 8px}}
@media(max-width:700px){.mg-head{padding-left:0;padding-right:0;padding-top:35px}.mg-back{top:0;left:0;font-size:11px;min-height:28px;padding:5px 8px}}
@media(max-width:480px) and (min-height:560px){.mg-main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}.mg-controls{grid-column:1;grid-row:1}.mg-play{grid-column:1;grid-row:2}.mg-keypanel{grid-column:1;grid-row:3;display:grid;grid-template-columns:1fr 2fr;align-items:center;gap:4px}.mg-keytitle{display:none}.mg-entry{grid-column:1;grid-row:1}.mg-keys{grid-column:2;grid-row:1/3;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}.mg-key{min-height:30px;font-size:15px;padding:0}.mg-key.mg-action{font-size:9px}.mg-square{width:min(100%, 38vh, 330px)}.mg-triangle{width:min(100%, 40vh, 330px)}.mg-info{display:none}}
@media(max-height:480px){.mg-head p{display:none}.mg-app{padding:3px;gap:2px}.mg-head h1{font-size:15px}.mg-main{padding:4px;gap:5px}.mg-controls{gap:4px}.mg-controls select,.mg-controls .mg-btn{min-height:26px;padding:2px 5px}.mg-key{min-height:25px}.mg-entry{height:25px}.mg-keypanel{gap:3px}.mg-info{display:none}.mg-footer{min-height:24px}.mg-footer button{padding:3px 8px}.mg-square{width:min(100%, 65vh, 300px)}.mg-triangle{width:min(100%, 66vh, 310px)}}
</style></head><body><div class="mg-app"><header class="mg-head"><a class="mg-back" href="../../">← Į pagrindinį puslapį</a><h1>✨ Įdomieji kvadratai ir trikampiai</h1><p>Įrašyk trūkstamus skaičius ir atrask stebuklingą sumą!</p></header><main class="mg-main"><section class="mg-controls"><label>Galvosūkis<select id="mg-shape"><option value="square">Kvadratas</option><option value="triangle">Trikampis</option><option value="random">Abu pakaitomis</option></select></label><label>Sudėtingumas<select id="mg-level"><option value="easy">Lengvas</option><option value="medium" selected>Vidutinis</option><option value="hard">Sudėtingesnis</option></select></label><button class="mg-btn mg-btn-primary" id="mg-new">🔄 Naujas žaidimas</button></section><section class="mg-play"><div class="mg-meta"><span class="mg-pill" id="mg-sum"></span><span class="mg-pill" id="mg-progress"></span></div><div class="mg-board-space" id="mg-board-space"><div id="mg-board" class="mg-square"></div></div><div class="mg-info" id="mg-info"></div><div class="mg-status" id="mg-status" role="status" aria-live="polite"></div><div class="mg-complete mg-hidden" id="mg-complete">🎉 Šaunuolis! Visi atsakymai teisingi!</div></section><section class="mg-keypanel"><div class="mg-keytitle">Įrašyk skaičių</div><div class="mg-entry" id="mg-entry">Pasirink langelį</div><div class="mg-keys" id="mg-keys"></div></section></main><footer class="mg-footer"><button id="mg-help">💡 Priminti taisyklę</button><span class="mg-help mg-hidden" id="mg-help-text"></span></footer></div><script>
(()=>{'use strict';
const el=id=>document.getElementById(id), base=[8,1,6,3,5,7,4,9,2];let game,selected=null,typed='',lastShape='triangle',lastKey='';
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const sqLines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const trLines=[[0,1,3],[0,2,5],[3,4,5]];
// Check that visible numbers and the target sum determine exactly one real-valued solution.
function fullRank(n,lines,known){const matrix=[];for(const line of lines){const row=Array(n).fill(0);for(const j of line)row[j]=1;matrix.push(row)}for(const j of known){const row=Array(n).fill(0);row[j]=1;matrix.push(row)}let rank=0;for(let c=0;c<n;c++){let p=rank;while(p<matrix.length&&Math.abs(matrix[p][c])<1e-8)p++;if(p===matrix.length)continue;[matrix[rank],matrix[p]]=[matrix[p],matrix[rank]];const div=matrix[rank][c];for(let k=c;k<n;k++)matrix[rank][k]/=div;for(let r=rank+1;r<matrix.length;r++){const f=matrix[r][c];for(let k=c;k<n;k++)matrix[r][k]-=f*matrix[rank][k]}rank++}return rank===n}
function pickKnown(n,lines,count){for(let tries=0;tries<200;tries++){const a=shuffle(Array.from({length:n},(_,i)=>i)).slice(0,count);if(fullRank(n,lines,a))return new Set(a)}return null}
function makeSquare(level){const cfg={easy:{aa:[1,2],bb:4,known:5,max:25},medium:{aa:[1,2,3],bb:5,known:4,max:35},hard:{aa:[2,3,4],bb:7,known:3,max:50}}[level];for(let t=0;t<1000;t++){const a=cfg.aa[rand(0,cfg.aa.length-1)],b=rand(0,cfg.bb);let vals=base.map(x=>a*x+b);for(let r=0,n=rand(0,3);r<n;r++)vals=[vals[6],vals[3],vals[0],vals[7],vals[4],vals[1],vals[8],vals[5],vals[2]];if(rand(0,1))vals=[vals[2],vals[1],vals[0],vals[5],vals[4],vals[3],vals[8],vals[7],vals[6]];const sum=3*(5*a+b);if(Math.max(...vals)>cfg.max||sum>100)continue;const known=pickKnown(9,sqLines,cfg.known);if(!known)continue;const key='s'+vals.join(',')+[...known].join(',');if(key===lastKey)continue;lastKey=key;return {shape:'square',vals,known,sum,lines:sqLines}}throw Error('Nepavyko sukurti kvadrato')}
function makeTriangle(level){const cfg={easy:{max:15,known:4,sum:45},medium:{max:25,known:3,sum:75},hard:{max:32,known:3,sum:100}}[level];for(let t=0;t<10000;t++){const top=rand(1,cfg.max),bl=rand(1,cfg.max),br=rand(1,cfg.max);const low=Math.max(top+bl,top+br,bl+br)+1,high=Math.min(cfg.sum,top+bl+cfg.max,top+br+cfg.max,bl+br+cfg.max);if(low>high)continue;const sum=rand(low,high),vals=[top,sum-top-bl,sum-top-br,bl,sum-bl-br,br];if(vals.some(x=>x<1||x>cfg.max)||new Set(vals).size<6)continue;const known=pickKnown(6,trLines,cfg.known);if(!known)continue;const key='t'+vals.join(',')+[...known].join(',');if(key===lastKey)continue;lastKey=key;return {shape:'triangle',vals,known,sum,lines:trLines}}throw Error('Nepavyko sukurti trikampio')}
function start(){let shape=el('mg-shape').value;if(shape==='random'){shape=lastShape==='square'?'triangle':'square';lastShape=shape}game=(shape==='square'?makeSquare:makeTriangle)(el('mg-level').value);game.answers={};selected=null;typed='';el('mg-status').textContent='';el('mg-complete').classList.add('mg-hidden');el('mg-help-text').classList.add('mg-hidden');el('mg-sum').textContent='🎯 Bendra suma: '+game.sum;el('mg-info').textContent=shape==='square'?'Visų eilučių, stulpelių ir įstrižainių suma vienoda.':'Visų trijų trikampio kraštinių suma vienoda.';render()}
function render(){const board=el('mg-board');board.replaceChildren();board.className=game.shape==='square'?'mg-square':'mg-triangle';if(game.shape==='triangle'){board.innerHTML='<svg viewBox="0 0 400 360" aria-hidden="true"><path d="M200 38 L48 315 L352 315 Z" fill="#f0f4ff" stroke="#91a4d8" stroke-width="8" stroke-linejoin="round"/></svg>'}const coords=[[50,11],[31,47],[69,47],[12,85],[50,85],[88,85]];game.vals.forEach((v,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='mg-cell';btn.dataset.index=i;if(game.shape==='triangle'){btn.style.left=coords[i][0]+'%';btn.style.top=coords[i][1]+'%'}if(game.known.has(i)){btn.textContent=v;btn.classList.add('mg-given');btn.disabled=true;btn.setAttribute('aria-label','Duotas skaičius '+v)}else{btn.textContent=game.answers[i]??'';btn.setAttribute('aria-label','Įrašomas skaičius, vieta '+(i+1));btn.addEventListener('click',()=>select(i));if(game.answers[i]!==undefined)btn.classList.add(game.answers[i]===v?'mg-right':'mg-wrong');if(selected===i)btn.classList.add('mg-active')}board.appendChild(btn)});progress();entry()}
function select(i){selected=i;typed=game.answers[i]===undefined?'':String(game.answers[i]);el('mg-status').textContent='';render()}
function entry(){el('mg-entry').textContent=selected===null?'Pasirink langelį':typed||'Įrašyk skaičių'}
function key(k){if(selected===null){el('mg-status').textContent='Pirmiausia pasirink tuščią langelį.';return}if(k==='del')typed=typed.slice(0,-1);else if(k==='ok'){if(!typed){el('mg-status').textContent='Įrašyk skaičių.';return}const value=Number(typed);game.answers[selected]=value;el('mg-status').textContent=value===game.vals[selected]?'✅ Teisingai!':'🔁 Dar ne visai. Pabandyk dar kartą.';render();if(Object.keys(game.answers).filter(i=>game.answers[i]===game.vals[i]).length===game.vals.length-game.known.size){el('mg-complete').classList.remove('mg-hidden');el('mg-status').textContent='🌟 Galvosūkis įveiktas!'}return}else if(typed.length<3)typed+=k;entry()}
function progress(){const right=Object.keys(game.answers).filter(i=>game.answers[i]===game.vals[i]).length;el('mg-progress').textContent='✅ Atlikta: '+right+' / '+(game.vals.length-game.known.size)}
for(const k of ['1','2','3','4','5','6','7','8','9','del','0','ok']){const b=document.createElement('button');b.type='button';b.className='mg-key'+(k==='del'?' mg-action':k==='ok'?' mg-action mg-confirm':'');b.textContent=k==='del'?'⌫ Trinti':k==='ok'?'✓ Tikrinti':k;b.addEventListener('click',()=>key(k));el('mg-keys').appendChild(b)}
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(/^[0-9]$/.test(e.key)){key(e.key);e.preventDefault()}else if(e.key==='Backspace'){key('del');e.preventDefault()}else if(e.key==='Enter'){key('ok');e.preventDefault()}});
el('mg-new').addEventListener('click',start);el('mg-shape').addEventListener('change',start);el('mg-level').addEventListener('change',start);el('mg-help').addEventListener('click',()=>{const h=el('mg-help-text');h.textContent=game.shape==='square'?'Sudėk eilutės, stulpelio ar įstrižainės skaičius.':'Sudėk tris kiekvienos kraštinės skaičius.';h.classList.toggle('mg-hidden')});start();
})();
</script></body></html>
